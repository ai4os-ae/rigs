openapi: 3.1.0

info:
  title: AI4OS rigs
  version: "1.1.0"
  summary: Build and boot-test Linux kernels on the AI4OS research rigs.
  description: |
    Submit a kernel commit, an optional patch and a configuration; a rig builds
    it and hands back the artifacts, the logs and a report.

    ### Three kinds of job

    `kind: build` compiles a kernel. `kind: test` boots one in a QEMU virtual
    machine, runs something in it, and tears it down. `kind: fuzz` runs
    syzkaller against one for a few hours and reports what it broke.

    Not every rig runs every kind: fuzzing is enabled per rig, because its
    virtual machines are started by the daemon rather than inside a build
    sandbox. Read `kinds` from `/v1/rigs` rather than assuming.

    A test either describes the kernel it wants, exactly as a build job does —
    in which case the build comes out of the store if that rig has already done
    it — or names an earlier job with `from`, which is the short way to say
    "boot what I just built".

    What runs inside is either the kernel's own selftests, which is what a test
    with no script of its own does, or a Python program you supply. Either way
    the guest has no network, gets torn down when the script finishes, and
    cannot outlive `test.timeout_seconds`.

    ### `state` and `passed` answer different questions

    This is the one thing worth reading before writing a client.

    `state` is what happened to the *job*. `passed` is whether the *kernel did
    what was asked* — compiled, for a build; booted and passed its tests, for a
    test. A patch that does not build, or a kernel that panics on boot, is a
    perfectly good answer to the question that was asked, so it comes back as
    `state: succeeded` with `passed: false` and the evidence in the log.

    `state: failed` means the daemon or the build system itself broke, and you
    have learned nothing about your patch.

    **So branch on `passed`, never on `state`.**

    For a fuzz job this reads backwards from what you wanted, and it is the
    same rule: crashes found means `passed: false`. The job did exactly what
    was asked and the kernel did not survive it. A run that reached its
    deadline without a crash is `passed: true`.

    ### Fuzzing is the one kind that is not cached

    A build and a test are pure functions of their inputs, so an identical
    request is answered from the store. A fuzzing run is not: what it finds
    depends on how long it ran and how lucky it was. Only its inputs are built
    that way — the kernel, the guest image and the fuzzer — and the run itself
    is a supervised process with a deadline.

    Two things follow. Its artifacts are readable *while it runs*, unlike a
    build's, so a reproducer can be fetched from a campaign that is still
    going. And its kernel shares no build with a `build` or `test` job against
    the same commit, because fuzzing forces `KCOV`, `KASAN` and debug info into
    the configuration.

    ### Why the second build is fast

    A job is built in two stages: an unpatched base for its commit and
    configuration, then the patch applied on top. The base is shared by every
    patch against that commit, so only the first one pays for it — measured on
    a rig, 5m28s for the base and around 20s per patch after that. Submitting
    an identical job twice returns the second from cache in about a second.

    Nothing about this is visible in the API, and clients need no build tooling
    of their own.

    ### Identity

    A job id is `<rig>.<id-on-that-rig>`. Builds are reproducible — the build
    timestamp, host and user are pinned — so the same job on two different rigs
    produces byte-identical artifacts, and a manifest fetched from one rig is
    valid against bytes fetched from another.

servers:
  # Relative, so it resolves against wherever this spec was loaded from: the
  # docs are served by the broker's own host, on whichever address the reader
  # reached it by.
  - url: /
    description: The fleet broker serving this page

security:
  - bearerAuth: []

tags:
  - name: jobs
    description: Submitting work and collecting what came out of it.
  - name: fleet
    description: What rigs exist and how busy they are.

paths:
  /v1/jobs:
    post:
      tags: [jobs]
      summary: Submit a build job
      description: |
        Places the job on a rig and returns it. Placement prefers a rig that
        already built this commit and configuration, since that rig has the
        expensive base in its store; otherwise the shortest queue.

        Use `rig` to pin a machine or `system` to constrain the architecture.
        Neither is substituted silently: if the named rig is down, or no rig
        runs that system, this fails with `409` rather than building somewhere
        you did not ask for.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobRequest"
            examples:
              patched:
                summary: A candidate patch against v6.17
                value:
                  kind: build
                  kernel:
                    commit: e5f0a698b34ed76002dc5cff3804a61c80233a7a
                  config:
                    base: defconfig
                    set:
                      CONFIG_ZRAM: m
                  patch: |
                    --- a/drivers/block/zram/zram_drv.c
                    +++ b/drivers/block/zram/zram_drv.c
                    @@ -2879,6 +2879,8 @@
                     	struct zram_table_entry zram_te;
                     	int ret;

                    +	pr_info("zram: hello from a rig\n");
                    +
                     	BUILD_BUG_ON(__NR_ZRAM_PAGEFLAGS > sizeof(zram_te.flags) * 8);
              unpatched:
                summary: Just the commit, to warm the shared base
                value:
                  kernel:
                    commit: e5f0a698b34ed76002dc5cff3804a61c80233a7a
                  config:
                    base: defconfig
                    set:
                      CONFIG_ZRAM: m
              pinned:
                summary: Pinned to one rig
                value:
                  rig: laptop-01
                  kernel:
                    commit: e5f0a698b34ed76002dc5cff3804a61c80233a7a
                  config:
                    base: defconfig
              boot-test:
                summary: Boot a patched kernel and run the kernel's own tests
                value:
                  kind: test
                  kernel:
                    commit: e5f0a698b34ed76002dc5cff3804a61c80233a7a
                  config:
                    base: defconfig
                    set:
                      CONFIG_ZRAM: m
                  patch: |
                    --- a/drivers/block/zram/zram_drv.c
                    +++ b/drivers/block/zram/zram_drv.c
                  test:
                    modules: [zram]
              scripted-test:
                summary: Boot a kernel you already built and run your own test
                value:
                  kind: test
                  from: laptop-01.20260908T091828-0221e5cfee685827
                  test:
                    modules: [zram]
                    timeout_seconds: 300
                    script: |
                      import os

                      assert os.path.exists("/sys/block/zram0"), "zram0 did not appear"

                      with open("/sys/block/zram0/disksize", "w") as f:
                          f.write(str(64 << 20))
                      with open("/dev/zram0", "wb") as dev:
                          dev.write(b"hello from a rig" * 4096)

                      with open("/sys/block/zram0/mm_stat") as f:
                          orig, compressed = f.read().split()[:2]
                      print(f"{orig} bytes compressed to {compressed}")
                      assert int(compressed) < int(orig), "zram compressed nothing"
      responses:
        "202":
          description: Accepted and queued on a rig.
          headers:
            Location:
              schema: { type: string }
              description: Path of the created job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: |
            No rig can take this job: the pinned rig is unknown or unreachable,
            or no live rig runs the requested system.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502": { $ref: "#/components/responses/BadGateway" }

    get:
      tags: [jobs]
      summary: List jobs across the fleet
      description: |
        Every rig's jobs, merged and newest first. A rig that cannot be reached
        is named in `unreachable` rather than failing the listing — a fleet is
        expected to have machines that come and go.
      responses:
        "200":
          description: The fleet's jobs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items: { $ref: "#/components/schemas/Job" }
                  unreachable:
                    type: [array, "null"]
                    description: Rigs that did not answer.
                    items: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/jobs/{id}:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      tags: [jobs]
      summary: Fetch one job
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [jobs]
      summary: Cancel a running job, or delete a finished one
      description: |
        A running job is cancelled and its record kept, so you can see that it
        was cancelled; deleting it is a second call.

        Deleting a finished job releases its artifacts to garbage collection —
        while the job exists, its output is pinned on the rig.
      responses:
        "202":
          description: Cancellation started.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, examples: [cancelling] }
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/jobs/{id}/log:
    parameters:
      - $ref: "#/components/parameters/JobId"
      - name: offset
        in: query
        description: |
          Resume from this byte position. A client whose connection dropped
          mid-build picks up where it stopped instead of re-reading half an
          hour of output.
        schema: { type: integer, minimum: 0 }
      - name: follow
        in: query
        description: |
          Set to `1` to hold the response open and stream output as the build
          produces it, until the job reaches a terminal state.
        schema: { type: string, enum: ["1"] }
    get:
      tags: [jobs]
      summary: Read or follow the build log
      responses:
        "200":
          description: Log output, streamed when following.
          content:
            text/plain:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: No such job, or it has not started and has no log yet.

  /v1/jobs/{id}/artifacts:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      tags: [jobs]
      summary: List the artifacts, with hashes
      description: |
        Sizes and SHA-256 for every file the build produced, computed inside
        the build sandbox — so a client can verify what it downloads against a
        manifest the build itself wrote, rather than one the server asserts.
      responses:
        "200":
          description: The manifest.
          content:
            application/json:
              schema:
                type: object
                properties:
                  artifacts:
                    type: object
                    additionalProperties:
                      $ref: "#/components/schemas/Artifact"
                examples:
                  - artifacts:
                      bzImage:
                        size: 14222336
                        sha256: 161f1ce064f11829e7dd1871ac04d3bf48825955a7f623077fa84c68400577c8
                      vmlinux:
                        size: 52056392
                        sha256: 4f71fd5c70e62e0507678eac83ff410964076e66e46f5d726a5574de5ef247b8
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: The job has produced no artifacts yet.

  /v1/jobs/{id}/artifacts/{path}:
    parameters:
      - $ref: "#/components/parameters/JobId"
      - name: path
        in: path
        required: true
        description: |
          Path as it appears in the manifest.

          A build job produces `bzImage`, `vmlinux`, `config`, `report.json`
          and `modules/lib/modules/6.17.0/kernel/drivers/block/zram/zram.ko`.

          A test job produces `result.json`, `console.log` — the serial console
          from firmware to power-off, which is where a panic is — `dmesg.log`,
          `kselftest.log`, `script.log`, `lsmod.log` and `uname.log`.
        schema: { type: string }
    get:
      tags: [jobs]
      summary: Download one artifact
      responses:
        "200":
          description: The file.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/jobs/{id}/bundle.tar.gz:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      tags: [jobs]
      summary: Download the whole output tree
      description: |
        Everything the build produced, as one stream, with the layout intact.
        This is what to fetch when you need a walkable tree rather than a few
        named files — resolving a module's dependencies means globbing for
        `.ko` files and reading `modules.dep` beside them.
      responses:
        "200":
          description: gzipped tar of the build output.
          content:
            application/gzip:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: The job has produced no artifacts yet.

  /v1/jobs/{id}/crashes:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      tags: [jobs]
      summary: What a fuzz run has found
      description: |
        Fuzz jobs only. Answered **while the run is going**, which is the point
        of it: a campaign with four hours left on it can still hand you a
        reproducer now.

        Fetch the reproducer itself from
        `/v1/jobs/{id}/artifacts/{path}/repro.cprog`, using the `path` on each
        crash.
      responses:
        "200":
          description: The crashes so far, most frequently hit first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  crashes:
                    type: array
                    items: { $ref: "#/components/schemas/Crash" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Not a fuzz job.

  /v1/fuzz/profiles:
    get:
      tags: [jobs]
      summary: Curated fuzzing campaigns this rig ships
      description: |
        A profile is everything a campaign needs beyond weights — the devices
        that make a target reachable at all, and the configuration symbols that
        go with them — reviewed in git rather than retyped into a request. Name
        one as `fuzz.profile`; anything you send inline merges over it.
      responses:
        "200":
          description: The profiles available.
          content:
            application/json:
              schema:
                type: object
                properties:
                  profiles:
                    type: array
                    items: { $ref: "#/components/schemas/FuzzProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: This rig does not run fuzz jobs.

  /v1/rigs:
    get:
      tags: [fleet]
      summary: What rigs exist and how busy they are
      description: |
        Polled in the background rather than on demand, so `checked_at` says
        how fresh each answer is. Useful for choosing a `system`, or for
        deciding whether to pin.
      responses:
        "200":
          description: The fleet.
          content:
            application/json:
              schema:
                type: object
                properties:
                  rigs:
                    type: array
                    items: { $ref: "#/components/schemas/Rig" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/status:
    get:
      tags: [fleet]
      summary: The broker itself
      responses:
        "200":
          description: Broker health.
          content:
            application/json:
              schema:
                type: object
                properties:
                  hostname: { type: string }
                  time: { type: string, format: date-time }
                  rigs: { type: integer, description: Rigs configured. }
                  rigs_up: { type: integer, description: Rigs answering. }
                  jobs_open:
                    type: integer
                    description: Jobs queued or running across the fleet.
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        An API key issued for this fleet. Every endpoint needs one — there is
        no unauthenticated path, including the status endpoints, which would
        otherwise enumerate the fleet.

  parameters:
    JobId:
      name: id
      in: path
      required: true
      description: |
        `<rig>.<id-on-that-rig>`, exactly as returned when the job was
        submitted. The rig name in it is what routes the request.
      schema:
        type: string
        examples: ["laptop-01.20260908T091828-0221e5cfee685827"]

  responses:
    Unauthorized:
      description: Missing or unrecognised API key.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such job, or no such rig in this fleet.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: The job was malformed or asked for something unsupported.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadGateway:
      description: The rig could not be reached.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          examples: ['no rig named "laptop-99" in this fleet']

    JobRequest:
      type: object
      properties:
        kind:
          type: string
          default: build
          enum: [build, test, fuzz]
          description: |
            `build` compiles a kernel; `test` boots one under QEMU and runs
            something in it; `fuzz` runs syzkaller against one for a few hours.
            Not every rig runs every kind — fuzzing has to be enabled per rig —
            so read `kinds` from `/v1/rigs` rather than assuming.
        fuzz:
          $ref: "#/components/schemas/FuzzRequest"
        from:
          type: string
          description: |
            Test and fuzz jobs only. The id of a finished build job whose kernel to
            boot, exactly as it was returned — `<rig>.<id>`. The rig named in
            it is where the test runs, because that is where the kernel is; a
            `rig` that disagrees with it fails with `409`.

            Mutually exclusive with `kernel`, `config` and `patch`: a job
            either names a kernel or describes one. Describing one costs
            nothing extra when that rig has already built it, so prefer it when
            you have the spec — a job that carries its own spec means the same
            thing on any rig and after the build it came from is deleted.
        test:
          $ref: "#/components/schemas/TestRequest"
        kernel:
          type: object
          required: [commit]
          properties:
            commit:
              type: string
              pattern: "^[0-9a-f]{40}$"
              description: |
                A full 40-character commit. Not a tag or a branch: a job has to
                mean the same thing tomorrow.
            remote:
              type: string
              description: |
                Where to fetch the commit if the rig's mirror lacks it.
                Defaults to the rig's configured kernel remote, which is the
                normal case.
        patch:
          type: string
          description: |
            A unified diff, applied with `patch -p1`. Omit it to build the
            commit as-is, which is how you warm the shared base before
            submitting patches against it.
        config:
          type: object
          properties:
            base:
              type: string
              default: defconfig
              description: A kernel make target — `defconfig`, `tinyconfig`.
            set:
              type: object
              additionalProperties:
                type: string
                enum: [y, m, n]
              description: |
                Symbol overrides applied on top of the base, with or without
                the `CONFIG_` prefix. Values are `y`, `m` or `n` and nothing
                else: this is data, not a hook for make commands.

                Every symbol is re-read from the resulting `.config` and the
                build fails if one was dropped — a symbol lost to an unmet
                dependency would otherwise produce a kernel that quietly lacks
                the driver under test, which is worse than failing.
        arch:
          type: string
          default: x86_64
          enum: [x86_64]
        rig:
          type: string
          description: Pin to this rig by name. Fails with 409 if it is down.
        system:
          type: string
          description: |
            Constrain to rigs of this system, matched against what each rig
            reports. Derived from `arch` when omitted.
          examples: [x86_64-linux]

    FuzzRequest:
      type: object
      description: |
        Fuzz jobs only. How long to run syzkaller for, and what to point it at.

        Everything here is optional: a fuzz job with no `fuzz` block at all is
        a general, undirected run, which is what syzkaller does best.
      properties:
        duration_seconds:
          type: integer
          default: 14400
          description: |
            How long to fuzz for. A run ends on its own — rigs are unattended
            and shared with build and test jobs. The rig's ceiling is usually
            24 hours; a request for more is refused rather than shortened.
        profile:
          type: string
          description: |
            A curated campaign shipped by the rig, by name. `GET
            /v1/fuzz/profiles` lists them. Profiles carry what is too subtle to
            retype into a request — the devices a target needs to be reachable
            at all, and the configuration symbols that go with them. Anything
            you send inline merges over it, focus areas by name.
          examples: [e1000]
        focus:
          type: array
          maxItems: 16
          items: { $ref: "#/components/schemas/FocusArea" }
          description: |
            Weight how often the fuzzer picks programs covering a region of
            the kernel.
        background_weight:
          type: number
          default: 1.0
          description: |
            The weight given to everything the focus areas do not cover, so
            focus weights read as multiples of "the rest of the kernel".

            You cannot express this as a `focus` entry, and that is deliberate.
            syzkaller treats a focus list with no unfiltered entry as *ignore
            everything else* rather than *prefer these* — discarding the
            general coverage signal, silently, while the run goes on looking
            healthy. The rig always appends it. Set this to `0` if you really
            do mean only your filters.
        enable_syscalls:
          type: array
          items: { type: string }
          description: |
            Restrict the fuzzer to these. Names are syzkaller's, and are
            validated by syzkaller rather than here — the set depends on the
            descriptions it was built with.
          examples: [["ioctl$sock_SIOCETHTOOL"]]
        disable_syscalls:
          type: array
          items: { type: string }
        procs:
          type: integer
          default: 8
          description: Parallel test processes inside each VM.
        reproduce:
          type: boolean
          default: true
          description: |
            Whether to reduce each crash to a reproducer. A crash without one
            is a report a maintainer cannot act on.
        corpus:
          type: string
          default: shared
          description: |
            `shared` seeds this run from the rig's corpus for this campaign and
            writes back to it, so a bounded run is not a cold start. `cold`
            does neither. A job id seeds from that job.

            The shared corpus is keyed on the focus areas and syscall filters,
            not on the kernel: syzkaller's programs stay useful across
            rebuilds.
        modules:
          type: array
          items: { type: string }
          description: |
            Loaded in the guest before the fuzzer starts, for a driver under
            test configured `=m`. A driver that was never loaded is a focus
            area that reports no coverage for a reason nothing else explains.
        vm:
          type: object
          properties:
            count: { type: integer }
            cpu: { type: integer }
            memory_mb:
              type: integer
              default: 3072
              description: |
                Not a tuning knob below about 3072. `syz-executor` maps its
                data segment at a fixed address and that mapping fails against
                a KASAN kernel on a smaller guest: the VM dies with `SYZFAIL:
                mmap of data segment failed`, reboots, and dies again. Nothing
                reports an error — the pool looks healthy and the execution
                rate stays at zero.
            devices:
              type: array
              maxItems: 4
              items: { $ref: "#/components/schemas/FuzzDevice" }
          description: |
            The VM pool. A rig caps the count against its own cores and memory
            and will not be talked above it — overcommitting does not fail, it
            thrashes — so ask for fewer, not more.

    FocusArea:
      type: object
      required: [name, weight]
      properties:
        name:
          type: string
          description: |
            Labels this area's statistics, which is the only way to tell
            whether it is being reached at all. See `focus_corpus` on the job.
          examples: [e1000]
        files:
          type: array
          items: { type: string }
          description: |
            Regular expressions over kernel source paths. A filter matching
            nothing is rejected before the kernel is built.
          examples: [["drivers/net/ethernet/intel/e1000/"]]
        functions:
          type: array
          items: { type: string }
        weight:
          type: number
          description: Relative to `background_weight`. Must be above zero.
          examples: [10.0]

    FuzzDevice:
      type: object
      description: |
        An emulated device to give each VM, from the rig's allow-list.

        This is here instead of syzkaller's raw `qemu_args`, which would turn
        "submit a patch to be fuzzed" into "run QEMU on this rig with my argv".
      required: [type]
      properties:
        type:
          type: string
          description: A QEMU device type the rig allows.
          examples: [e1000]
        addr:
          type: string
          description: |
            PCI address, `0x10` or above. syzkaller appends its own NIC after
            these, so a device at a low slot is enumerated first and takes
            `eth0` — which leaves the VM unreachable and every boot reported as
            a failure.
          examples: ["0x11"]
        netdev:
          type: string
          enum: [none, user-restricted]
          default: none

    FuzzResult:
      type: object
      description: Live counters for a fuzz job, updated while it runs.
      properties:
        corpus: { type: integer }
        coverage: { type: integer }
        executed: { type: integer }
        exec_per_sec: { type: integer }
        crashes: { type: integer }
        reproducing: { type: integer }
        focus_corpus:
          type: object
          additionalProperties: { type: integer }
          description: |
            Corpus size per focus area, and the field to read on a directed
            run. An area at zero while the total climbs means the fuzzer cannot
            reach that code at all — a different problem from weighting it too
            low, and not otherwise visible.
        elapsed_seconds: { type: integer }
        duration_seconds: { type: integer }

    Crash:
      type: object
      properties:
        id: { type: string }
        title:
          type: string
          examples: ["KASAN: slab-use-after-free Read in e1000_probe"]
        count:
          type: integer
          description: Times it was hit. One may be a fluke.
        repro:
          type: boolean
          description: A syzkaller program reproducing it exists.
        crepro:
          type: boolean
          description: |
            A C program does — this is the form a maintainer wants, and the one
            to attach to a report.
        path:
          type: string
          description: |
            Where it is under `/v1/jobs/{id}/artifacts/`, fetchable while the
            run is still going.
          examples: [crashes/a1b2c3d4]

    FuzzProfile:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        focus:
          type: array
          items: { $ref: "#/components/schemas/FocusArea" }
        procs: { type: integer }
        config:
          type: object
          additionalProperties: { type: string }
        vm: { type: object }

    TestRequest:
      type: object
      description: |
        What to do once the kernel has booted. Omit it entirely and the job
        boots the kernel and runs the kernel's own selftests on it, which is
        the useful default for "does this kernel work".
      properties:
        script:
          type: string
          description: |
            Python 3, run inside the guest as an ordinary program. Its exit
            status is the test's: zero passed, anything else did not, and
            everything it printed is kept as the `script.log` artifact.

            The guest is a plain Linux userspace with busybox, bash and
            python3, the kernel's modules under `/lib/modules`, and **no
            network** — the build sandbox has none to give it. It is torn down
            as soon as the script returns.

            Supplying a script turns kselftest off unless you ask for it back:
            you asked a specific question, and several minutes of unrelated
            tests would slow the answer down and blur what a failure means.
        modules:
          type: array
          items: { type: string }
          description: |
            Modules to load before anything else runs, so a script or a
            selftest can assume the driver under test is present. A module that
            will not load fails the test.
        kselftest:
          type: object
          properties:
            enable:
              type: boolean
              description: |
                Defaults to true when there is no `script` and false when there
                is. Set it explicitly to have both.
            targets:
              type: array
              items: { type: string }
              description: |
                Selftest collections to build and run, as named under
                `tools/testing/selftests`. Empty is the rig's default set,
                chosen because it builds and passes on a plain `defconfig`.

                Most other collections need configuration symbols `defconfig`
                does not set, and kselftest reports a missing symbol as a
                failure rather than a skip — so name a target and you may also
                need to name the symbols it wants in `config.set`. A target
                that does not compile is reported in `result.json` under
                `kselftest.targets_missing` and fails the test rather than
                being quietly dropped.
        timeout_seconds:
          type: integer
          default: 900
          maximum: 7200
          description: |
            How long the whole run may take, boot included. A kernel that hangs
            is a result, and this is how long the rig waits for it.
        memory_mb:
          type: integer
          default: 4096
          maximum: 32768
          minimum: 512
        cpus:
          type: integer
          default: 2
          maximum: 64
        fail_on_warning:
          type: boolean
          default: false
          description: |
            Whether a `WARNING:` splat in the kernel log fails the test. Off by
            default, because a clean kernel warns about something on QEMU's
            hardware often enough that failing on it teaches people to
            disregard the verdict. An oops, a `BUG:` or a panic always fails
            and is not configurable.

    TestResult:
      type: object
      description: |
        `result.json`, fetched like any other artifact. The verdict it carries
        is the same one in the job's `passed`.
      properties:
        passed: { type: boolean }
        booted:
          type: boolean
          description: |
            Whether the kernel reached userspace at all. False here with
            `console.log` full of a panic is the most common interesting
            failure.
        reasons:
          type: array
          items: { type: string }
          description: Why it did not pass. Empty when it did.
        guest_status:
          type: [integer, "null"]
          description: |
            The status the guest itself reported, or null if it never finished
            — it panicked, or the timeout expired.
        tainted:
          type: [integer, "null"]
          description: |
            `/proc/sys/kernel/tainted` after the run. Non-zero means the kernel
            did something it is not supposed to have done, whatever the tests
            said.
        kernel_splats:
          type: array
          description: Oops, BUG and panic lines found in the kernel log.
          items:
            type: object
            properties:
              pattern: { type: string }
              line: { type: string }
        kselftest:
          type: [object, "null"]
          properties:
            total: { type: integer }
            passed: { type: integer }
            failed: { type: integer }
            skipped: { type: integer }
            targets_requested: { type: array, items: { type: string } }
            targets_built: { type: array, items: { type: string } }
            targets_missing:
              type: array
              items: { type: string }
              description: Targets that were asked for and did not compile.
            results:
              type: array
              items:
                type: object
                properties:
                  name: { type: string }
                  status: { type: string, enum: [passed, failed, skipped] }

    Job:
      type: object
      properties:
        id:
          type: string
          examples: ["laptop-01.20260908T091828-0221e5cfee685827"]
        rig: { type: string, examples: [laptop-01] }
        state:
          type: string
          enum: [queued, running, succeeded, failed, cancelled]
          description: |
            What happened to the job. `succeeded` means it ran to completion —
            it does **not** mean the kernel compiled. See `passed`.
        passed:
          type: [boolean, "null"]
          description: |
            **This is the field that judges a patch.** Null until the job
            finishes.

            For a build: whether the kernel compiled and its configuration
            verified. For a test: whether it booted, ran everything asked of
            it without a failure, and produced no oops or panic. `result.json`
            says which of those it was.
        error:
          type: string
          description: "Set when `state` is `failed`: why the rig could not answer."
        fuzz:
          $ref: "#/components/schemas/FuzzResult"
        kernel_release:
          type: string
          examples: ["6.17.0"]
        store_path:
          type: string
          description: |
            Where the output lives on the rig. Content-addressed and
            reproducible, so it identifies the build rather than merely
            locating it.
        submitted_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        spec:
          $ref: "#/components/schemas/JobRequest"

    Artifact:
      type: object
      properties:
        size: { type: integer }
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: Computed inside the build sandbox.
        symlink:
          type: string
          description: Present instead of size/sha256 when the entry is a link.

    Rig:
      type: object
      properties:
        name: { type: string, examples: [laptop-01] }
        url: { type: string, description: The rig's own build daemon, on the mesh. }
        up: { type: boolean }
        error: { type: string, description: Why it did not answer, when down. }
        system: { type: string, examples: [x86_64-linux] }
        queue_depth: { type: integer }
        running: { type: integer }
        capacity:
          type: integer
          description: |
            Builds it will run at once. Normally 1 — a kernel build already
            uses every thread on the machine.
        load:
          type: array
          items: { type: number }
          description: 1, 5 and 15 minute load averages.
        store_free_bytes: { type: integer }
        kinds:
          type: array
          items: { type: string }
          description: Job kinds this rig implements.
        fuzz_slots_free:
          type: integer
          description: |
            Fuzz runs this rig could start right now. Reported separately
            because `queue_depth` does not describe fuzzing: a run holds its
            slot for hours, so a rig with an empty queue and its only slot
            mid-campaign is the least available rig in the fleet.
        fuzz_capacity:
          type: integer
        checked_at:
          type: string
          format: date-time
          description: When the broker last heard from it.
